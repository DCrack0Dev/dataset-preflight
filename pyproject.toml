[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dataset-preflight"
version = "0.2.0"
description = "Validate CSV files against explicit data contracts before they enter a pipeline."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "DCrack0Dev" }]
dependencies = [
    "pydantic>=2.0,<3",
]

[project.optional-dependencies]
observability = [
    "sentry-sdk>=2.0,<3",
]

[dependency-groups]
dev = [
    "coverage==7.16.2",
    "mypy==2.4.0",
    "pip-audit==2.10.1",
    "ruff==0.17.1",
]

[project.scripts]
dataset-preflight = "dataset_preflight.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "TRY"]
ignore = ["E501", "TRY003", "TRY301"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
