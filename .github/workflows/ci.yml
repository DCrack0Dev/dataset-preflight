name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install coverage tool
        run: python -m pip install --disable-pip-version-check 'coverage>=7.6,<8'
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Enforce coverage gate
        run: coverage run --branch -m unittest discover -s tests && coverage report --fail-under=85
      - name: Compile source
        run: python -m compileall -q src tests
      - name: Validate example dataset
        run: python -m dataset_preflight validate examples/orders.csv examples/orders.contract.json
        env:
          PYTHONPATH: src
