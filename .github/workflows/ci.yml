name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify locked development environment
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.17"
      - run: uv lock --check
      - name: Install coverage tool
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Lint source and tests
        run: ruff check src tests
      - name: Check static types
        run: mypy src
      - name: Audit pinned development dependencies
        run: pip-audit -r requirements-dev.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Enforce coverage gate
        run: coverage run --branch -m unittest discover -s tests && coverage report --fail-under=85
      - name: Compile source
        run: python -m compileall -q src tests
      - name: Validate example dataset
        run: python -m dataset_preflight validate examples/orders.csv examples/orders.contract.json

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build runtime image
        run: docker build --tag dataset-preflight:ci .
        env:
          PYTHONPATH: src
      - name: Validate Compose configuration
        run: docker compose config --quiet
